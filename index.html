<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>隨機單字朗讀器 (KK音標錨點版)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
.container { display: flex; gap: 20px; margin-bottom: 15px; }
.box { flex: 1; display: flex; flex-direction: column; }
textarea { width: 100%; font-size: 16px; padding: 10px; box-sizing: border-box; resize: vertical; }
.settings { margin-bottom: 15px; font-size: 16px; background-color: #f0f8ff; padding: 15px; border-radius: 5px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between;}
.setting-group { display: flex; gap: 20px; align-items: center; }
.settings input, .settings select { font-size: 16px; padding: 5px; }
.settings input[type="number"] { width: 60px; text-align: center; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
button { padding: 10px 15px; font-size: 16px; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; background-color: #f9f9f9; }
button:hover { background-color: #e9e9e9; }
.btn-primary { background-color: #d4edda; border-color: #c3e6cb; }
.btn-upload { background-color: #cce5ff; border-color: #b8daff; font-weight: bold; }
.btn-upload:hover { background-color: #b8daff; }
#status { font-size: 24px; font-weight: bold; color: #d9534f; margin-bottom: 10px; }
label { font-weight: bold; margin-bottom: 5px; color: #333; }
</style>
</head>
<body>
<h2>單字抽考 (AI KK音標錨點版)</h2>

<div class="settings">
<div class="setting-group">
<div>
<label for="langSelect">🗣️ 朗讀語言：</label>
<select id="langSelect">
<option value="en-US">英文 (English)</option>
<option value="zh-TW">中文 (台灣)</option>
<option value="ja-JP">日文 (日本語)</option>
</select>
</div>
<div>
<label for="interval">⏱️ 每個單字作答：</label>
<input type="number" id="interval" value="30" min="1"> 秒
</div>
</div>

<div>
<input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)">
<button id="uploadBtn" class="btn-upload" onclick="document.getElementById('imageInput').click()">📸 拍課本擷取單字</button>
</div>
</div>

<div style="font-size:13px; color:#666; margin:-10px 0 15px;">
💡 拍照小技巧：把書頁壓平、正對鏡頭拍攝、避免反光與陰影、單字盡量佔滿畫面，辨識率會更高。
</div>

<details id="debugDetails" style="margin-bottom:15px; display:none;">
<summary style="cursor:pointer; color:#555;">🔍 顯示 OCR 原始辨識文字（除錯用，可比對哪裡辨識錯誤）</summary>
<textarea id="debugText" rows="6" readonly style="width:100%; font-size:12px; background:#f8f9fa; margin-top:8px; box-sizing:border-box;"></textarea>
</details>

<div class="container">
<div class="box">
<label>📝 未考詞彙 (可手動修改)：</label>
<textarea id="pendingList" rows="10" placeholder="貼上單字，或是點擊上方「上傳相片」自動擷取..."></textarea>
</div>
<div class="box">
<label>✅ 已考詞彙 (歷史記錄)：</label>
<textarea id="testedList" rows="10" readonly style="background-color: #f8f9fa;"></textarea>
</div>
</div>

<div class="btn-group">
<button onclick="startReading()" class="btn-primary">▶ 開始測驗</button>
<button onclick="togglePause()" id="pauseBtn">⏸ 暫停</button>
<button onclick="prevWord()">⏮ 上一個</button>
<button onclick="repeatWord()">🔁 重讀目前詞彙</button>
<button onclick="nextWordManual()">⏭ 提早換下一個</button>
<button onclick="stopReading()" style="background-color: #f8d7da; border-color: #f5c6cb;">⏹ 停止</button>
</div>

<div id="status">目前詞彙：<span id="currentWord">尚未開始</span></div>

<div id="cropModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; flex-direction:column; align-items:center; justify-content:center;">
<div style="color:#fff; margin-bottom:10px; font-size:15px; text-align:center; padding:0 15px;">
📐 請用手指拖曳框選「只有單字＋音標」的那一欄，再按確認<br>
<span style="font-size:12px; color:#ccc;">（框選範圍越乾淨、不含右邊例句，辨識率越高）</span>
</div>
<div style="position:relative; touch-action:none;">
<canvas id="cropCanvas" style="touch-action:none; background:#222; display:block;"></canvas>
</div>
<div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
<button onclick="confirmCrop()" class="btn-primary">✅ 確認框選範圍</button>
<button onclick="useFullImage()">🖼 使用整張照片</button>
<button onclick="cancelCrop()" style="background-color:#f8d7da; border-color:#f5c6cb;">✖ 取消</button>
</div>
</div>

<script>
let timer;
let pendingWords = [];
let testedWords = [];
let historyIndex = -1;
let isPaused = false;

// 圖片前處理：灰階化 + 提高對比 + 放大，讓 OCR 更容易辨識課本上較小或較模糊的印刷字
function preprocessImage(file) {
return new Promise((resolve, reject) => {
const img = new Image();
img.onload = () => {
const scale = 2; // 放大兩倍，提升辨識解析度
const canvas = document.createElement('canvas');
canvas.width = img.width * scale;
canvas.height = img.height * scale;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

try {
const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
const data = imageData.data;
const contrast = 45; // -255 ~ 255，數字越大對比越強
const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
for (let i = 0; i < data.length; i += 4) {
let gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
gray = factor * (gray - 128) + 128;
gray = Math.max(0, Math.min(255, gray));
data[i] = data[i + 1] = data[i + 2] = gray;
}
ctx.putImageData(imageData, 0, 0);
} catch (e) {
console.warn('前處理略過（可能是跨網域限制）：', e);
}

canvas.toBlob(blob => resolve(blob || file), 'image/png');
};
img.onerror = () => resolve(file); // 前處理失敗就退回用原圖
img.src = URL.createObjectURL(file);
});
}

// ===== 框選裁切功能 =====
let cropOriginalFile = null;
let cropImgObj = null;
let cropScale = 1;
let cropSelecting = false;
let cropStart = { x: 0, y: 0 };
let cropEnd = { x: 0, y: 0 };

function handleFileSelect(event) {
const file = event.target.files[0];
if (!file) return;
cropOriginalFile = file;

const img = new Image();
img.onload = () => {
cropImgObj = img;
setupCropCanvas();
document.getElementById('cropModal').style.display = 'flex';
};
img.onerror = () => {
alert('❌ 圖片讀取失敗，請重新選擇照片。');
};
img.src = URL.createObjectURL(file);

event.target.value = ''; // 允許之後重複選同一張圖
}

function setupCropCanvas() {
const canvas = document.getElementById('cropCanvas');
const ctx = canvas.getContext('2d');

const maxW = window.innerWidth * 0.9;
const maxH = window.innerHeight * 0.65;
const ratio = Math.min(maxW / cropImgObj.width, maxH / cropImgObj.height, 1);

canvas.width = cropImgObj.width * ratio;
canvas.height = cropImgObj.height * ratio;
cropScale = ratio;

ctx.drawImage(cropImgObj, 0, 0, canvas.width, canvas.height);
cropStart = { x: 0, y: 0 };
cropEnd = { x: 0, y: 0 };

attachCropEvents(canvas);
}

function attachCropEvents(canvas) {
const getPos = (e) => {
const rect = canvas.getBoundingClientRect();
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;
return { x: clientX - rect.left, y: clientY - rect.top };
};

const start = (e) => {
e.preventDefault();
cropSelecting = true;
cropStart = getPos(e);
cropEnd = { ...cropStart };
redrawCropCanvas(canvas);
};
const move = (e) => {
if (!cropSelecting) return;
e.preventDefault();
cropEnd = getPos(e);
redrawCropCanvas(canvas);
};
const end = (e) => {
if (e) e.preventDefault();
cropSelecting = false;
};

canvas.onmousedown = start;
canvas.onmousemove = move;
canvas.onmouseup = end;
canvas.onmouseleave = end;
canvas.ontouchstart = start;
canvas.ontouchmove = move;
canvas.ontouchend = end;
}

function redrawCropCanvas(canvas) {
const ctx = canvas.getContext('2d');
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.drawImage(cropImgObj, 0, 0, canvas.width, canvas.height);

const x = Math.min(cropStart.x, cropEnd.x);
const y = Math.min(cropStart.y, cropEnd.y);
const w = Math.abs(cropEnd.x - cropStart.x);
const h = Math.abs(cropEnd.y - cropStart.y);

ctx.strokeStyle = '#00e676';
ctx.lineWidth = 2;
ctx.strokeRect(x, y, w, h);
ctx.fillStyle = 'rgba(0,230,118,0.15)';
ctx.fillRect(x, y, w, h);
}

function confirmCrop() {
const canvas = document.getElementById('cropCanvas');
const x = Math.min(cropStart.x, cropEnd.x);
const y = Math.min(cropStart.y, cropEnd.y);
const w = Math.abs(cropEnd.x - cropStart.x);
const h = Math.abs(cropEnd.y - cropStart.y);

if (w < 10 || h < 10) {
alert('請先用手指拖曳框選範圍，或按「使用整張照片」略過裁切。');
return;
}

const nx = x / cropScale;
const ny = y / cropScale;
const nw = w / cropScale;
const nh = h / cropScale;

const outCanvas = document.createElement('canvas');
outCanvas.width = nw;
outCanvas.height = nh;
const outCtx = outCanvas.getContext('2d');
outCtx.drawImage(cropImgObj, nx, ny, nw, nh, 0, 0, nw, nh);

outCanvas.toBlob(blob => {
closeCropModal();
runOcrPipeline(blob || cropOriginalFile);
}, 'image/png');
}

function useFullImage() {
const file = cropOriginalFile;
closeCropModal();
runOcrPipeline(file);
}

function cancelCrop() {
closeCropModal();
}

function closeCropModal() {
document.getElementById('cropModal').style.display = 'none';
cropImgObj = null;
}
// ===== 框選裁切功能結束 =====

async function runOcrPipeline(file) {
if (!file) return;

const uploadBtn = document.getElementById('uploadBtn');
const originalText = uploadBtn.innerText;

uploadBtn.innerText = '⏳ 圖片前處理中...';
uploadBtn.disabled = true;

const langMap = { 'en-US': 'eng', 'zh-TW': 'chi_tra', 'ja-JP': 'jpn' };
const selectedLang = document.getElementById('langSelect').value;
const ocrLang = langMap[selectedLang] || 'eng';

try {
const processedImage = await preprocessImage(file);

const result = await Tesseract.recognize(processedImage, ocrLang, {
logger: m => {
if (m.status === 'recognizing text') {
uploadBtn.innerText = ⏳ 辨識中 ${Math.round(m.progress * 100)}%`;
}
}
});
let text = result.data.text;

// 無論成功與否都保留原始辨識文字，方便使用者比對、手動修正
document.getElementById('debugText').value = text;
document.getElementById('debugDetails').style.display = 'block';

let extracted = [];

if (ocrLang === 'eng') {
const wordSet = new Set();
let match;

// 【規則1，最可靠】每一行開頭是「編號＋句點＋單字」，就算後面的音標括號被
// OCR 誤讀（例如短單字 man、或音標裡有逗號的 teenager），也能抓到單字本身
// 例如 "10. man [mæn]"、"16. teenager [`tin,edʒɚ]"
const lineStartRegex = /^[ \t]\d{1,3}\s[.\uFF0E]\s*([a-zA-Z][a-zA-Z-]{1,20})/gm;
while ((match = lineStartRegex.exec(text)) !== null) {
wordSet.add(match[1].toLowerCase());
}

// 【規則2】編號＋單字＋音標括號（編號跟單字中間若被斷行也適用）
const numberedRegex = /\d{1,3}\s*[.\uFF0E]\s*([a-zA-Z][a-zA-Z-]{1,20})\s*[[(]/g;
while ((match = numberedRegex.exec(text)) !== null) {
wordSet.add(match[1].toLowerCase());
}

// 【規則3，備用】單純「單字＋音標括號」，用來補救編號完全辨識失敗的情況
const bracketRegex = /\b([a-zA-Z-]{2,20})\s*[[(]/g;
while ((match = bracketRegex.exec(text)) !== null) {
wordSet.add(match[1].toLowerCase());
}

const stopWords = ['the','and','are','was','were','that','this','with','from','some','there','who','what','when','where','how','why','not','out','for','but'];
extracted = [...wordSet].filter(w => !stopWords.includes(w) && w.length >= 2);

} else {
extracted = text.split(/[\n\s,、。]+/).map(w => w.trim());
extracted = extracted.filter(w => w !== '' && w.length > 1);
}

if (extracted.length === 0) {
alert('⚠️ 找不到單字！請確認照片中有拍到「編號＋單字＋[KK音標]」的格式，並盡量拍正、避免反光模糊。下方已顯示 OCR 原始辨識文字，可參考後手動輸入單字。');
return;
}

for (let i = extracted.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[extracted[i], extracted[j]] = [extracted[j], extracted[i]];
}

const pendingListDOM = document.getElementById('pendingList');
let currentWords = pendingListDOM.value.split('\n').map(w => w.trim()).filter(w => w !== '');
let combinedWords = [...new Set([...currentWords, ...extracted])];

pendingListDOM.value = combinedWords.join('\n');
alert(✅ 成功鎖定並萃取${extracted.length} 個單字！若有辨識錯誤，可在「未考詞彙」欄位中直接手動修改。`);

} catch (err) {
console.error(err);
alert('❌ 圖片辨識失敗，請確認網路連線是否正常。');
} finally {
uploadBtn.innerText = originalText;
uploadBtn.disabled = false;
}
}

function getIntervalMs() {
let sec = parseInt(document.getElementById('interval').value, 10);
return (isNaN(sec) || sec <= 0) ? 30000 : sec * 1000;
}

function updateTextareas() {
document.getElementById('pendingList').value = pendingWords.join('\n');
document.getElementById('testedList').value = testedWords.join('\n');
}

function startReading() {
const text = document.getElementById('pendingList').value;
pendingWords = [...new Set(text.split('\n').map(w => w.trim()).filter(w => w !== ''))];

if (pendingWords.length === 0) {
alert('請先在「未考詞彙」區輸入單字，或是拍照上傳！');
return;
}

testedWords = [];
historyIndex = -1;
isPaused = false;
document.getElementById('pauseBtn').innerText = '⏸ 暫停';

updateTextareas();
stopReading(false);
drawNextWord();
}

function drawNextWord() {
if (historyIndex < testedWords.length - 1) {
historyIndex++;
speakCurrentWord();
return;
}

if (pendingWords.length === 0) {
document.getElementById('currentWord').innerText = '🎉 測驗完成！';
document.getElementById('currentWord').style.color = 'green';
clearTimeout(timer);
return;
}

const randomIndex = Math.floor(Math.random() * pendingWords.length);
const word = pendingWords.splice(randomIndex, 1)[0];

testedWords.push(word);
historyIndex = testedWords.length - 1;

updateTextareas();
speakCurrentWord();
}

function speakCurrentWord() {
clearTimeout(timer);
window.speechSynthesis.cancel();

if (historyIndex < 0 || historyIndex >= testedWords.length) return;

const word = testedWords[historyIndex];
document.getElementById('currentWord').innerText = word;
document.getElementById('currentWord').style.color = '#d9534f';

const utterance = new SpeechSynthesisUtterance(word);
utterance.lang = document.getElementById('langSelect').value;
window.speechSynthesis.speak(utterance);

if (!isPaused) {
timer = setTimeout(drawNextWord, getIntervalMs());
}
}

function togglePause() {
if (testedWords.length === 0) return;
isPaused = !isPaused;
const pauseBtn = document.getElementById('pauseBtn');
if (isPaused) {
clearTimeout(timer);
pauseBtn.innerText = '▶ 繼續';
document.getElementById('currentWord').innerText += ' (已暫停)';
} else {
pauseBtn.innerText = '⏸ 暫停';
speakCurrentWord();
}
}

function prevWord() {
if (historyIndex > 0) {
historyIndex--;
speakCurrentWord();
} else {
alert('已經是第一個了！');
}
}

function repeatWord() { if (historyIndex >= 0) speakCurrentWord(); }

function nextWordManual() { if (testedWords.length > 0) drawNextWord(); }

function stopReading(resetUI = true) {
clearTimeout(timer);
window.speechSynthesis.cancel();
if (resetUI) {
document.getElementById('currentWord').innerText = '已停止';
document.getElementById('currentWord').style.color = 'black';
isPaused = false;
document.getElementById('pauseBtn').innerText = '⏸ 暫停';
}
}
</script>
</body>
</html>
