<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>隨機單字朗讀器 (全域雷達鎖定版)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    .container { display: flex; gap: 20px; margin-bottom: 15px; }
    .box { flex: 1; display: flex; flex-direction: column; }
    textarea { width: 100%; font-size: 16px; padding: 10px; box-sizing: border-box; resize: vertical; }
    .settings { margin-bottom: 15px; font-size: 16px; background-color: #f0f8ff; padding: 15px; border-radius: 5px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between;}
    .setting-group { display: flex; gap: 20px; align-items: center; }
    .settings input, .settings select { font-size: 16px; padding: 5px; }
    .settings input[type="number"] { width: 60px; text-align: center; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    button { padding: 10px 15px; font-size: 16px; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; background-color: #f9f9f9; }
    button:hover { background-color: #e9e9e9; }
    .btn-primary { background-color: #d4edda; border-color: #c3e6cb; }
    .btn-upload { background-color: #cce5ff; border-color: #b8daff; font-weight: bold; }
    .btn-upload:hover { background-color: #b8daff; }
    #status { font-size: 24px; font-weight: bold; color: #d9534f; margin-bottom: 10px; }
    label { font-weight: bold; margin-bottom: 5px; color: #333; }
  </style>
</head>
<body>
  <h2>單字抽考 (AI 全域雷達鎖定版)</h2>
  
  <div class="settings">
    <div class="setting-group">
      <div>
        <label for="langSelect">🗣️ 朗讀語言：</label>
        <select id="langSelect">
          <option value="en-US">英文 (English)</option>
          <option value="zh-TW">中文 (台灣)</option>
          <option value="ja-JP">日文 (日本語)</option>
        </select>
      </div>
      <div>
        <label for="interval">⏱️ 每個單字作答：</label>
        <input type="number" id="interval" value="30" min="1"> 秒
      </div>
    </div>
    
    <div>
      <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="processImage(event)">
      <button id="uploadBtn" class="btn-upload" onclick="document.getElementById('imageInput').click()">📸 拍課本擷取單字</button>
    </div>
  </div>

  <div class="container">
    <div class="box">
      <label>📝 未考詞彙 (可手動修改)：</label>
      <textarea id="pendingList" rows="10" placeholder="貼上單字，或是點擊上方「上傳相片」自動擷取..."></textarea>
    </div>
    <div class="box">
      <label>✅ 已考詞彙 (歷史記錄)：</label>
      <textarea id="testedList" rows="10" readonly style="background-color: #f8f9fa;"></textarea>
    </div>
  </div>
  
  <div class="btn-group">
    <button onclick="startReading()" class="btn-primary">▶ 開始測驗</button>
    <button onclick="togglePause()" id="pauseBtn">⏸ 暫停</button>
    <button onclick="prevWord()">⏮ 上一個</button>
    <button onclick="repeatWord()">🔁 重讀目前詞彙</button>
    <button onclick="nextWordManual()">⏭ 提早換下一個</button>
    <button onclick="stopReading()" style="background-color: #f8d7da; border-color: #f5c6cb;">⏹ 停止</button>
  </div>
  
  <div id="status">目前詞彙：<span id="currentWord">尚未開始</span></div>

  <script>
    let timer;
    let pendingWords = [];
    let testedWords = [];
    let historyIndex = -1; 
    let isPaused = false;

    async function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const uploadBtn = document.getElementById('uploadBtn');
      const originalText = uploadBtn.innerText;
      
      uploadBtn.innerText = '⏳ 辨識與精準鎖定中...';
      uploadBtn.disabled = true;

      const langMap = { 'en-US': 'eng', 'zh-TW': 'chi_tra', 'ja-JP': 'jpn' };
      const selectedLang = document.getElementById('langSelect').value;
      const ocrLang = langMap[selectedLang] || 'eng';

      try {
        const result = await Tesseract.recognize(file, ocrLang);
        let text = result.data.text;
        let extracted = [];

        if (ocrLang === 'eng') {
          // 【核心修正】全域雷達掃描 (不再限制行首)
          // 只要全文中出現「數字 + 點 + 英文單字」的組合，就直接抓出來
          // 例如不管前面有什麼雜訊，只要看到 "1. baby" 就能成功抓取 "baby"
          const regex = /(?:^|\s)\d{1,3}\s*[\.\,]\s*([a-zA-Z\-]{2,})/g;
          let match;
          
          while ((match = regex.exec(text)) !== null) {
            let w = match[1].toLowerCase();
            extracted.push(w);
          }
          
          // 黑名單過濾
          const stopWords = ['the','and','are','was','were','that','this','with','from','some','there','who','what','when','where','how','why','not','out','for','but','alice','tom','joe','nancy','tina'];
          extracted = extracted.filter(w => !stopWords.includes(w));

        } else {
          extracted = text.split(/[\n\s,、。]+/).map(w => w.trim());
          extracted = extracted.filter(w => w !== '' && w.length > 1);
        }

        if (extracted.length === 0) {
          alert('⚠️ 找不到帶有數字標號的單字！請確認照片中有拍到「數字編號 (如 1. baby)」。');
          return;
        }

        for (let i = extracted.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [extracted[i], extracted[j]] = [extracted[j], extracted[i]];
        }

        const pendingListDOM = document.getElementById('pendingList');
        let currentWords = pendingListDOM.value.split('\n').map(w => w.trim()).filter(w => w !== '');
        let combinedWords = [...new Set([...currentWords, ...extracted])];
        
        pendingListDOM.value = combinedWords.join('\n');
        alert(`✅ 成功鎖定並萃取 ${extracted.length} 個單字！`);
        
      } catch (err) {
        console.error(err);
        alert('❌ 圖片辨識失敗，請確認網路連線是否正常。');
      } finally {
        uploadBtn.innerText = originalText;
        uploadBtn.disabled = false;
        event.target.value = ''; 
      }
    }

    function getIntervalMs() {
      let sec = parseInt(document.getElementById('interval').value, 10);
      return (isNaN(sec) || sec <= 0) ? 30000 : sec * 1000;
    }

    function updateTextareas() {
      document.getElementById('pendingList').value = pendingWords.join('\n');
      document.getElementById('testedList').value = testedWords.join('\n');
    }

    function startReading() {
      const text = document.getElementById('pendingList').value;
      pendingWords = [...new Set(text.split('\n').map(w => w.trim()).filter(w => w !== ''))];
      
      if (pendingWords.length === 0) {
        alert('請先在「未考詞彙」區輸入單字，或是拍照上傳！');
        return;
      }
      
      testedWords = [];
      historyIndex = -1;
      isPaused = false;
      document.getElementById('pauseBtn').innerText = '⏸ 暫停';
      
      updateTextareas();
      stopReading(false); 
      drawNextWord();
    }

    function drawNextWord() {
      if (historyIndex < testedWords.length - 1) {
        historyIndex++;
        speakCurrentWord();
        return;
      }

      if (pendingWords.length === 0) {
        document.getElementById('currentWord').innerText = '🎉 測驗完成！';
        document.getElementById('currentWord').style.color = 'green';
        clearTimeout(timer);
        return;
      }
      
      const randomIndex = Math.floor(Math.random() * pendingWords.length);
      const word = pendingWords.splice(randomIndex, 1)[0];
      
      testedWords.push(word);
      historyIndex = testedWords.length - 1;
      
      updateTextareas();
      speakCurrentWord();
    }

    function speakCurrentWord() {
      clearTimeout(timer);
      window.speechSynthesis.cancel();
      
      if (historyIndex < 0 || historyIndex >= testedWords.length) return;
      
      const word = testedWords[historyIndex];
      document.getElementById('currentWord').innerText = word;
      document.getElementById('currentWord').style.color = '#d9534f';

      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = document.getElementById('langSelect').value; 
      window.speechSynthesis.speak(utterance);

      if (!isPaused) {
        timer = setTimeout(drawNextWord, getIntervalMs());
      }
    }

    function togglePause() {
      if (testedWords.length === 0) return; 
      isPaused = !isPaused;
      const pauseBtn = document.getElementById('pauseBtn');
      if (isPaused) {
        clearTimeout(timer);
        pauseBtn.innerText = '▶ 繼續';
        document.getElementById('currentWord').innerText += ' (已暫停)';
      } else {
        pauseBtn.innerText = '⏸ 暫停';
        speakCurrentWord(); 
      }
    }

    function prevWord() {
      if (historyIndex > 0) {
        historyIndex--;
        speakCurrentWord();
      } else {
        alert('已經是第一個了！');
      }
    }

    function repeatWord() { if (historyIndex >= 0) speakCurrentWord(); }
    
    function nextWordManual() { if (testedWords.length > 0) drawNextWord(); }

    function stopReading(resetUI = true) {
      clearTimeout(timer);
      window.speechSynthesis.cancel();
      if (resetUI) {
        document.getElementById('currentWord').innerText = '已停止';
        document.getElementById('currentWord').style.color = 'black';
        isPaused = false;
        document.getElementById('pauseBtn').innerText = '⏸ 暫停';
      }
    }
  </script>
</body>
</html>
